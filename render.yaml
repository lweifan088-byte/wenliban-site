services:
  - type: web
    name: wenliban-campus-companion
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: wenliban-postgres
          property: connectionString
      - key: PGSSLMODE
        value: disable
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

databases:
  - name: wenliban-postgres
    databaseName: wenliban
    user: wenliban_app
    plan: 0.1c-256mb
    diskSizeGB: 15
    ipAllowList: []

